name: bot / oneshot

on:
  pull_request:
    paths:
      - tasks/**
      - .github/workflows/bot--oneshot.yaml

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}--${{ github.event.pull_request.id }}--${{ github.actor }}

jobs:
  run:
    if: |
      contains(github.event.pull_request.labels.*.name, '/run-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i --prod

      - uses: int128/aws-kms-github-app-token-action@244b9e7f5e76581cdb9310748263980b9da63f8a # v0.3.0
        id: token
        with:
          role-to-assume: ${{ secrets.APP_AWS_IAM_ROLE_ARN }}
          aws-region: us-west-2
          kms-key-id: alias/github-app-int128-bot
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          owner: ${{ github.repository_owner }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: int128/glob-changed-files-action@da4390afc29a44befd3844d22a9d7968935b2eab # v2.46.0
        id: changed-tasks
        with:
          paths: |
            tasks/:task/**
          transform: |
            :task
      - run: pnpm start
        env:
          INPUT_TASKS: ${{ steps.changed-tasks.outputs.paths }}
          INPUT_TOKEN: ${{ steps.token.outputs.token }}
          OPENAI_AUDIENCE: "https://api.openai.com"
          OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
